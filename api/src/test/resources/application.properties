# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so every placeholder the beans need must be defined here
# (no real secrets — these are throwaway values for the local/CI context to load).

# Datasource — points at the Postgres started via `docker compose -f compose.yaml up -d`
spring.datasource.url=jdbc:postgresql://localhost:5432/easytennis
spring.datasource.username=easytennis
spring.datasource.password=easytennis

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — dummy 64-char secret (>=256 bits, valid for HS256); not a real credential
jwt.secret=test-only-secret-test-only-secret-test-only-secret-test-only-01
jwt.expiration.ms=900000

# CORS — SecurityConfig requires this; any value works for context loading
cors.allowed.origins=http://localhost:3000

# Mail — host only, so JavaMailSender autoconfigures for EmailServiceImpl (no real send in tests)
spring.mail.host=localhost
spring.mail.port=3025
